<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Yardage Book</title>
<meta name="theme-color" content="#101d16" />
<meta name="description" content="Offline golf simulator session tracker and insights journal." />

<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Yardage Book" />

<style>
  html, body { margin: 0; padding: 0; background: #101d16; }
  #root { min-height: 100vh; }
  #boot-fallback {
    color: #9fb2a1; font-family: system-ui, sans-serif; padding: 40px 20px;
    text-align: center;
  }
  #boot-error {
    display: none; color: #eee8d8; font-family: system-ui, sans-serif;
    padding: 40px 20px; max-width: 480px; margin: 0 auto;
  }
  #boot-error pre {
    font-size: 11px; color: #bd5b3c; background: #182a20; padding: 12px;
    border-radius: 8px; white-space: pre-wrap; word-break: break-word;
  }
</style>

<!-- React + libraries (cached by the service worker after first load) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"><div id="boot-fallback">Loading Yardage Book…</div></div>
<div id="boot-error">
  <div style="font-weight:700; font-size:17px; margin-bottom:8px;">Couldn't load a required library</div>
  <div style="font-size:13px; color:#9fb2a1; margin-bottom:14px; line-height:1.5;">
    One of the scripts this app needs (React, PapaParse, or Babel) failed to load — usually a connectivity issue on first load. Reconnect and reload the page. Details:
  </div>
  <pre id="boot-error-detail"></pre>
</div>

<script>
  // Manually invoke Babel (classic JSX runtime) instead of the automatic
  // <script type="text/babel"> scanner — the automatic runtime otherwise
  // injects an `import` statement for the JSX helper, which breaks in a
  // plain (non-module) script.
  (async function () {
    try {
      const res = await fetch("./app.js");
      if (!res.ok) throw new Error("app.js fetch failed: " + res.status);
      const code = await res.text();
      const output = Babel.transform(code, {
        presets: [["react", { runtime: "classic" }]],
        filename: "app.js",
      }).code;
      const script = document.createElement("script");
      script.textContent = output;
      document.body.appendChild(script);
    } catch (err) {
      document.getElementById("root").style.display = "none";
      document.getElementById("boot-error").style.display = "block";
      document.getElementById("boot-error-detail").textContent =
        String(err && (err.stack || err.message || err));
    }
  })();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
